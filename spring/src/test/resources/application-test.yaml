spring:
  datasource:
    url: jdbc:h2:mem:dortfolio-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE DOMAIN IF NOT EXISTS vector AS FLOAT ARRAY
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

  # 마이그레이션은 Postgres 전용(vector, pg_trgm)이라 H2 테스트에서는 사용하지 않는다
  flyway:
    enabled: false

# presigned URL 서명은 네트워크 없이 로컬 계산으로 끝나므로 실제 버킷이 없어도 된다.
# 다만 버킷 이름이 비면 SDK가 거부하므로 테스트 전용 이름을 준다.
# 운영 버킷 이름을 쓰지 않는 이유는, 자격 증명이 섞여 들어갔을 때 실제 버킷을 건드리지 않기 위해서다
aws:
  s3:
    bucket: test-bucket
    region: ap-northeast-2

jwt:
  secret: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
  salt: 0123456789abcdef0123456789abcdef
  access-expiration: 1800000
  refresh-expiration: 1209600000

record:
  delete-grace-period-days: 30
  recent-record-limit: 5
  default-page-size: 7
  max-page-size: 50

search:
  default-page-size: 10
  max-page-size: 50

app:
  fastapi:
    base-url: http://localhost:8000
    connect-timeout: 1s
    read-timeout: 1s

record-analysis:
  enabled: false
  async-core-pool-size: 1
  async-max-pool-size: 1
  async-queue-capacity: 10
  lock-timeout: 1s

matching:
  default-record-limit: 3
  max-record-limit: 10
  candidate-record-limit: 10
  embedding-dimension: 3072
  indexed-embedding-models:
    - gemini-embedding-2
  question-max-length: 500
  min-match-rate: 30
  daily-ai-request-limit: 20
  daily-ai-request-ttl: 1d
  daily-ai-request-zone: Asia/Seoul
  question-tags:
    - id: JOB_STUDY
      content: 해당 직무에서 열심히 공부했던 경험에 대해 서술하시오.
    - id: CONFLICT_RESOLUTION
      content: 팀원과 갈등이 생겼을 때 어떻게 해결했는지 서술하시오.

insight:
  minimum-analyzed-record-count: 10
  regeneration-cooldown: 24h
  recommendation-candidate-ratio: 0.1
  recommendation-candidate-min: 1
  recommendation-candidate-max: 20
  recommendation-min-similarity: 0.0
  embedding-model: gemini-embedding-2
  recommendation-max-attempts: 2
  recommendation-timeout: 30s

  generation:
    lock-ttl: 30s
    async-core-pool-size: 1
    async-max-pool-size: 1
    async-queue-capacity: 10
