spring:
  application:
    name: dortfolio

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # ddl-auto로 이미 테이블이 만들어진 DB에서도 동작하도록 한다
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:dotfolio.cotato@gmail.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET}
  salt: ${JWT_SALT}
  access-expiration: 1800000      # Access Token 만료 시간: 30분
  refresh-expiration: 1209600000  # Refresh Token 만료 시간: 14일

app:
  cors:
    # 쉼표로 구분. 배포 환경에서는 프론트 주소(Vercel 등)를 CORS_ALLOWED_ORIGINS로 넘긴다
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
    connect-timeout: ${FASTAPI_CONNECT_TIMEOUT:3s}
    read-timeout: ${FASTAPI_READ_TIMEOUT:30s}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  oauth2:
    success-redirect-uri: ${FRONTEND_URL:http://localhost:3000}/oauth/redirect
    failure-redirect-uri: ${FRONTEND_URL:http://localhost:3000}/login

record:
  delete-grace-period-days: ${RECORD_DELETE_GRACE_PERIOD_DAYS:30}
  recent-record-limit: ${RECORD_RECENT_RECORD_LIMIT:5}
  default-page-size: ${RECORD_DEFAULT_PAGE_SIZE:7}
  max-page-size: ${RECORD_MAX_PAGE_SIZE:50}

search:
  default-page-size: ${SEARCH_DEFAULT_PAGE_SIZE:10}
  max-page-size: ${SEARCH_MAX_PAGE_SIZE:50}

record-analysis:
  enabled: ${RECORD_ANALYSIS_ENABLED:true}
  async-core-pool-size: ${RECORD_ANALYSIS_ASYNC_CORE_POOL_SIZE:2}
  async-max-pool-size: ${RECORD_ANALYSIS_ASYNC_MAX_POOL_SIZE:5}
  async-queue-capacity: ${RECORD_ANALYSIS_ASYNC_QUEUE_CAPACITY:100}
  lock-timeout: ${RECORD_ANALYSIS_LOCK_TIMEOUT:5s}

matching:
  default-record-limit: ${MATCHING_DEFAULT_RECORD_LIMIT:3}
  max-record-limit: ${MATCHING_MAX_RECORD_LIMIT:10}
  candidate-record-limit: ${MATCHING_CANDIDATE_RECORD_LIMIT:10}
  embedding-dimension: 3072
  indexed-embedding-models: ${MATCHING_INDEXED_EMBEDDING_MODELS:gemini-embedding-2}
  question-max-length: ${MATCHING_QUESTION_MAX_LENGTH:500}
  min-match-rate: ${MATCHING_MIN_MATCH_RATE:30}
  daily-ai-request-limit: ${MATCHING_DAILY_AI_REQUEST_LIMIT:20}
  daily-ai-request-ttl: ${MATCHING_DAILY_AI_REQUEST_TTL:1d}
  daily-ai-request-zone: ${MATCHING_DAILY_AI_REQUEST_ZONE:Asia/Seoul}
  question-tags:
    - id: JOB_STUDY
      content: 해당 직무에서 열심히 공부했던 경험에 대해 서술하시오.
    - id: CONFLICT_RESOLUTION
      content: 팀원과 갈등이 생겼을 때 어떻게 해결했는지 서술하시오.
    - id: GOAL_ACHIEVEMENT
      content: 목표를 달성하기 위해 노력했던 경험을 구체적으로 서술하시오.
    - id: LEADERSHIP
      content: 리더십을 발휘했던 경험에 대해 서술하시오.
    - id: DATA_PROBLEM_SOLVING
      content: 데이터를 활용하여 문제를 해결한 경험을 서술하시오.

insight:
  minimum-analyzed-record-count: 10
  regeneration-cooldown: 24h
  recommendation-candidate-limit: 5
  embedding-model: ${INSIGHT_EMBEDDING_MODEL:gemini-embedding-2}
  recommendation-max-attempts: ${INSIGHT_RECOMMENDATION_MAX_ATTEMPTS:2}
  recommendation-timeout: ${INSIGHT_RECOMMENDATION_TIMEOUT:10s}

  generation:
    lock-ttl: ${INSIGHT_GENERATION_LOCK_TTL:30s}
    async-core-pool-size: ${INSIGHT_ASYNC_CORE_POOL_SIZE:2}
    async-max-pool-size: ${INSIGHT_ASYNC_MAX_POOL_SIZE:5}
    async-queue-capacity: ${INSIGHT_ASYNC_QUEUE_CAPACITY:50}
