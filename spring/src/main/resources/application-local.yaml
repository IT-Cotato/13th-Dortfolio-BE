spring:
  config:
    activate:
      on-profile: local

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:dortfolio}
    username: ${POSTGRES_USER:dortfolio}
    password: ${POSTGRES_PASSWORD:dortfolio}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

app:
  fastapi:
    base-url: http://localhost:${FASTAPI_PORT:8000}
  oauth2:
    success-redirect-uri: http://localhost:3000/oauth/redirect
    failure-redirect-uri: http://localhost:3000/login
  frontend-url: http://localhost:3000

logging:
  level:
    com.itcotato.dortfolio: DEBUG
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SECRET}
  salt: ${JWT_SALT}