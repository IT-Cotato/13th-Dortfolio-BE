spring:
  config:
    activate:
      on-profile: local

  # docker-compose.local.yml을 직접 기동/관리하므로,
  # Spring Boot Docker Compose 플러그인의 compose.yaml 자동 실행은 꺼둡니다.
  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:dortfolio}
    username: ${POSTGRES_USER:dortfolio}
    password: ${POSTGRES_PASSWORD:dortfolio}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  fastapi:
    base-url: http://localhost:${FASTAPI_PORT:8000}

logging:
  level:
    com.itcotato.dortfolio: DEBUG
    org.hibernate.SQL: DEBUG
