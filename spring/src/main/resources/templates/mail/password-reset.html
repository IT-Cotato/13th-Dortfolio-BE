<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정 안내</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Arial', sans-serif; background-color: #f9f9f9;">
<div style="max-width: 600px; margin: 40px auto; padding: 30px; background-color: #ffffff; border: 1px solid #eef2f5; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);">

    <!-- 타이틀 구역 -->
    <h2 style="color: #4A90E2; margin-top: 0; font-size: 24px; font-weight: 700; border-bottom: 2px solid #f0f4f8; padding-bottom: 15px;">
        [도트폴리오] 비밀번호 재설정 안내
    </h2>

    <!-- 본문 내용 구역 -->
    <p style="color: #4a5568; font-size: 15px; line-height: 1.6; margin: 20px 0;">
        안녕하세요. 도트폴리오 서비스 이용을 위한 비밀번호 재설정 링크입니다.
    </p>
    <p style="color: #4a5568; font-size: 15px; line-height: 1.6; margin: 0 0 30px 0;">
        아래 버튼을 클릭하시면 새 비밀번호를 설정할 수 있는 페이지로 안전하게 이동합니다.
    </p>

    <!-- 버튼 구역 -->
    <div style="text-align: center; margin: 35px 0;">
        <a th:href="${resetLink}"
           style="background-color: #4A90E2; color: #ffffff; padding: 14px 32px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; display: inline-block; transition: background-color 0.2s;"
           target="_blank">
            비밀번호 재설정하기
        </a>
    </div>

    <!-- 경고 문구 구역 -->
    <div style="background-color: #fff5f5; border-left: 4px solid #ff5a5f; padding: 15px; border-radius: 4px; margin-top: 30px;">
        <p style="color: #ff5a5f; font-size: 13px; font-weight: 600; margin: 0;">
            * 본 링크는 <b>3분간만 유효</b>하며, 1회 사용 시 즉시 만료됩니다.
        </p>
    </div>

</div>
</body>
</html>
