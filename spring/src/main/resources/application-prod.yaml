spring:
  config:
    activate:
      on-profile: prod

  # 운영에서는 컨테이너를 compose로 직접 띄우므로 Spring의 docker-compose 연동은 끈다
  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dortfolio}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      # 스키마는 Flyway가 관리한다. Hibernate는 엔티티와 실제 스키마가 맞는지 검증만 한다
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.itcotato.dortfolio: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN

# 운영에서는 헬스체크만 열고 나머지 액추에이터 엔드포인트는 닫는다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 상세 값(DB 버전, 접속 정보 등)은 숨기되, 어떤 구성요소가 DOWN인지는 보이게 한다.
      # 배포가 실패했을 때 원인을 바로 알 수 있어야 한다
      show-details: never
      show-components: always
  health:
    mail:
      # Gmail SMTP는 외부 의존성이라 잠깐 안 된다고 앱 전체가 DOWN이 되면 안 된다.
      # (컨테이너 헬스체크가 실패해 배포가 막히고, 메일과 무관한 API까지 죽은 것으로 취급된다)
      enabled: false
