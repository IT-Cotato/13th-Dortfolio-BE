name: Deploy to EC2

on:
  push:
    branches: [ develop ]
  workflow_dispatch:   # 필요할 때 수동 실행

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 테스트 실행
        working-directory: spring
        run: |
          chmod +x gradlew
          ./gradlew test

  build-and-push:
    name: 이미지 빌드 및 푸시
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      spring-image: ${{ steps.meta.outputs.spring-image }}
      fastapi-image: ${{ steps.meta.outputs.fastapi-image }}
    steps:
      - uses: actions/checkout@v4

      # Docker 이미지 이름은 소문자만 허용하는데 저장소명(IT-Cotato/...)에 대문자가 있어 변환이 필요하다
      - name: 이미지 이름/태그 결정
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="${GITHUB_SHA::7}"
          echo "repo=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "spring-image=ghcr.io/${REPO}/spring:${TAG}" >> "$GITHUB_OUTPUT"
          echo "fastapi-image=ghcr.io/${REPO}/fastapi:${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Spring 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: ./spring
          push: true
          # 배포는 커밋 태그만 사용한다.
          # latest는 참조하는 곳이 없는데 푸시 요청만 두 배로 늘려, GHCR 속도 제한에 걸리기 쉬워진다
          tags: ${{ steps.meta.outputs.spring-image }}
          cache-from: type=gha,scope=spring
          cache-to: type=gha,mode=max,scope=spring

      - name: FastAPI 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: ./fastapi
          push: true
          tags: ${{ steps.meta.outputs.fastapi-image }}
          cache-from: type=gha,scope=fastapi
          cache-to: type=gha,mode=max,scope=fastapi

  deploy:
    name: EC2 배포
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH 접속 후 배포
        uses: appleboy/ssh-action@v1
        env:
          SPRING_IMAGE: ${{ needs.build-and-push.outputs.spring-image }}
          FASTAPI_IMAGE: ${{ needs.build-and-push.outputs.fastapi-image }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SPRING_IMAGE,FASTAPI_IMAGE,GITHUB_SHA
          script: |
            set -e
            cd ~/13th-Dortfolio-BE

            # 빌드된 바로 그 커밋의 compose 파일을 사용한다.
            # (develop을 받으면 빌드 시점과 배포 시점이 어긋날 수 있고, 머지 전 브랜치 테스트도 불가능하다)
            git fetch origin "$GITHUB_SHA"
            git reset --hard "$GITHUB_SHA"

            # GHCR_USERNAME은 GHCR_TOKEN(PAT)을 발급한 계정이어야 한다.
            # github.actor를 쓰면 푸시한 사람에 따라 토큰 소유자와 어긋나 로그인이 실패할 수 있다.
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            # 이미지 주소를 .env에 기록해 둔다.
            # 셸 환경변수로만 넘기면 이후 다른 세션(배포 검증, 수동 운영)에서 compose가 이미지를 찾지 못한다.
            sed -i '/^SPRING_IMAGE=/d;/^FASTAPI_IMAGE=/d' .env
            echo "SPRING_IMAGE=${SPRING_IMAGE}" >> .env
            echo "FASTAPI_IMAGE=${FASTAPI_IMAGE}" >> .env

            docker compose -f docker-compose.prod.yml pull spring fastapi
            docker compose -f docker-compose.prod.yml up -d

            # 오래된 이미지 정리 (디스크 용량 확보)
            docker image prune -f

      - name: 직무 역량 임베딩 동기화
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/13th-Dortfolio-BE

            # 임베딩 생성은 DB 마이그레이션과 FastAPI 기동이 모두 끝난 뒤 실행해야 한다.
            for i in $(seq 1 30); do
              SPRING_OK=$(curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null 2>&1 && echo yes || echo no)
              FASTAPI_STATE=$(docker inspect -f '{{.State.Health.Status}}' dortfolio-fastapi 2>/dev/null || echo unknown)

              if [ "$SPRING_OK" = "yes" ] && [ "$FASTAPI_STATE" = "healthy" ]; then
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "임베딩 동기화 실패: Spring 또는 FastAPI가 제한 시간 안에 준비되지 않았습니다."
                docker compose -f docker-compose.prod.yml ps spring fastapi
                exit 1
              fi

              echo "임베딩 동기화 대기 중... ($i/30) spring=$SPRING_OK fastapi=$FASTAPI_STATE"
              sleep 5
            done

            # 현재 모델 기준 누락분만 생성하므로 매 배포마다 실행해도 중복 저장되지 않는다.
            docker compose -f docker-compose.prod.yml run --rm \
              -e JOB_COMPETENCY_EMBEDDING_BATCH_ENABLED=true \
              -e JOB_COMPETENCY_EMBEDDING_BATCH_COMMAND=GENERATE_MISSING \
              -e STRENGTH_TAG_EMBEDDING_BATCH_ENABLED=true \
              -e STRENGTH_TAG_EMBEDDING_BATCH_COMMAND=GENERATE_MISSING \
              -e RECORD_ANALYSIS_RETRY_NOT_READY_BATCH_ENABLED=true \
              -e SPRING_MAIN_WEB_APPLICATION_TYPE=none \
              spring

      - name: 배포 검증
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # up -d는 컨테이너 기동만 확인하므로, 앱이 실제로 떴는지 헬스체크로 검증한다.
            # FastAPI는 외부에 포트를 열지 않으므로 컨테이너 헬스 상태로 확인한다
            # (Spring만 보면 AI 서버가 죽어도 배포가 성공으로 잡힌다)
            for i in $(seq 1 30); do
              SPRING_OK=$(curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null 2>&1 && echo yes || echo no)
              FASTAPI_STATE=$(docker inspect -f '{{.State.Health.Status}}' dortfolio-fastapi 2>/dev/null || echo unknown)

              if [ "$SPRING_OK" = "yes" ] && [ "$FASTAPI_STATE" = "healthy" ]; then
                # 여기까지는 컨테이너 내부 상태다.
                # 사용자가 실제로 쓰는 경로(HTTPS → nginx → spring)까지 확인해야 배포가 끝난 것이다
                DOMAIN=$(grep '^DOMAIN=' ~/13th-Dortfolio-BE/.env | cut -d= -f2)
                if [ -z "$DOMAIN" ]; then
                  echo "배포 성공: Spring, FastAPI 정상. (DOMAIN 미설정이라 HTTPS 검증은 건너뜁니다)"
                  exit 0
                fi
                # --resolve로 접속 대상만 루프백으로 바꾼다.
                # EC2는 자기 자신의 탄력적 IP로 되돌아오는 접속이 안 되기 때문이다.
                # 도메인 이름은 그대로 유지되므로 SNI와 인증서 검증은 실제와 동일하게 이뤄진다
                if curl -fsS --resolve "${DOMAIN}:443:127.0.0.1" \
                     "https://${DOMAIN}/v3/api-docs" > /dev/null 2>&1; then
                  echo "배포 성공: HTTPS 경로까지 정상 응답합니다. (https://${DOMAIN})"
                  exit 0
                fi
                echo "기동 대기 중... ($i/30) spring=yes fastapi=healthy https=no"
                sleep 5
                continue
              fi

              echo "기동 대기 중... ($i/30) spring=$SPRING_OK fastapi=$FASTAPI_STATE"
              sleep 5
            done

            echo "=== 배포 실패: 진단 정보 ==="
            echo "--- 컨테이너 상태 ---"
            docker ps -a --format 'table {{.Names}}\t{{.Status}}'
            echo "--- Spring 헬스 응답 본문 (어떤 항목이 DOWN인지 확인) ---"
            curl -s http://127.0.0.1:8080/actuator/health || true
            echo ""
            echo "--- Spring 로그 ---"
            docker logs --tail=100 dortfolio-spring
            echo "--- FastAPI 로그 ---"
            docker logs --tail=50 dortfolio-fastapi
            echo "--- Nginx 로그 ---"
            docker logs --tail=50 dortfolio-nginx 2>&1 || echo "(nginx 컨테이너 없음)"
            exit 1
