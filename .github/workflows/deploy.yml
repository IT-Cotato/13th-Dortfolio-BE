name: Deploy to EC2

on:
  push:
    branches: [ develop ]
  workflow_dispatch:   # 필요할 때 수동 실행

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/spring

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 테스트 실행
        working-directory: spring
        run: |
          chmod +x gradlew
          ./gradlew test

  build-and-push:
    name: 이미지 빌드 및 푸시
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: meta
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: ./spring
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: EC2 배포
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH 접속 후 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/13th-Dortfolio-BE

            # 최신 compose 파일과 fastapi 소스를 받는다
            git fetch origin develop
            git reset --hard origin/develop

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export SPRING_IMAGE="${{ needs.build-and-push.outputs.image }}"
            docker compose -f docker-compose.prod.yml pull spring
            docker compose -f docker-compose.prod.yml up -d --build

            # 오래된 이미지 정리 (디스크 용량 확보)
            docker image prune -f
