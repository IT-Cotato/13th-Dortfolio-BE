name: dortfolio-prod

# EC2 운영용 compose 파일.
# - spring/fastapi 이미지는 GitHub Actions가 빌드해 GHCR에 올린 것을 받아서 실행한다.
#   (EC2에서 빌드하지 않으므로 메모리가 작은 인스턴스에서도 안전하고, 코드 변경이 항상 반영된다)
# - postgres/redis는 외부에 포트를 열지 않는다(컨테이너 네트워크 안에서만 접근).
#   DB에 직접 붙어야 할 땐 SSH 터널을 쓴다.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dortfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # 확장(vector, pg_trgm) 생성은 Flyway V1 마이그레이션이 담당하므로 init 스크립트를 마운트하지 않는다
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dortfolio

  redis:
    image: redis:7-alpine
    container_name: dortfolio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dortfolio

  fastapi:
    image: ${FASTAPI_IMAGE}
    container_name: dortfolio-fastapi
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dortfolio

  spring:
    image: ${SPRING_IMAGE}
    container_name: dortfolio-spring
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_SALT: ${JWT_SALT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FASTAPI_BASE_URL: http://fastapi:8000
      FRONTEND_URL: ${FRONTEND_URL}
      # 프론트(Vercel 등) 주소. 없으면 로컬 개발 주소만 허용된다
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RECORD_ANALYSIS_ENABLED: ${RECORD_ANALYSIS_ENABLED:-true}
    ports:
      # 외부 요청은 nginx(80/443)가 받는다.
      # 8080은 루프백에만 바인딩해서 서버 안에서만 접근되게 한다
      # (배포 검증, 액추에이터 확인용. 인터넷에는 노출되지 않는다)
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - dortfolio

  nginx:
    image: nginx:1.27-alpine
    container_name: dortfolio-nginx
    restart: unless-stopped
    depends_on:
      - spring
    environment:
      DOMAIN: ${DOMAIN}
      # $host, $scheme 등 nginx 내부 변수는 건드리지 않고 DOMAIN만 치환한다
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    # 인증서가 갱신돼도 nginx는 시작할 때 읽은 걸 계속 쓴다. 6시간마다 reload해서 새 인증서를 반영한다
    command: >
      sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'
    networks:
      - dortfolio

  certbot:
    image: certbot/certbot
    container_name: dortfolio-certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # 최초 발급은 docs/DEPLOYMENT.md의 수동 절차로 하고, 여기서는 갱신만 담당한다.
    # 12시간마다 확인하되 실제 갱신은 만료 30일 전부터 일어난다
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  postgres-data:
  redis-data:
  certbot-conf:
  certbot-www:

networks:
  dortfolio:
